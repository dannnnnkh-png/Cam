# 在 GitHub 的 Mac 雲端主機上編譯 HomeCam，並上傳到 TestFlight。
# iPhone 上操作：GitHub App →這個 repo →Actions →「Build & TestFlight」→ Run workflow
# 沒設定 Apple 金鑰時只做「編譯檢查」，不會上傳。
name: Build & TestFlight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["**.md"]

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15-intel   # arm64 Mac 主機目前容量不足會排不到；Intel 主機一樣能編譯 iPhone App
    timeout-minutes: 60
    env:
      HAS_KEY: ${{ secrets.ASC_KEY_P8 != '' }}
      # Issuer ID / Key ID 只是識別碼，不是密鑰；真正的私鑰只放在 Secrets 的 ASC_KEY_P8
      ASC_ISSUER: ${{ secrets.ASC_ISSUER_ID || 'ed65397d-d8c9-4e70-b812-d2945fe4380a' }}
      ASC_KEY: ${{ secrets.ASC_KEY_ID || vars.ASC_KEY_ID || 'SKWD23679J' }}
      TEAM_ID: ${{ vars.TEAM_ID || 'LGFH6TK8SV' }}
      BUNDLE_ID: ${{ vars.BUNDLE_ID || 'com.dannnnnkh.homecam' }}
    steps:
      - uses: actions/checkout@v4

      - name: 選擇 Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app /Applications/Xcode_16.4*.app /Applications/Xcode_16.3*.app 2>/dev/null | sort -V | tail -1)
          echo "使用 $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: 產生 Xcode 專案
        run: |
          brew install xcodegen >/dev/null
          xcodegen generate

      - name: 還原套件快取（FFmpegKit 很大）
        uses: actions/cache/restore@v4
        with:
          path: SourcePackages
          key: spm-${{ hashFiles('project.yml') }}

      - name: 下載套件
        run: xcodebuild -resolvePackageDependencies -project HomeCam.xcodeproj -scheme HomeCam -clonedSourcePackagesDirPath SourcePackages | tail -5

      - name: 儲存套件快取
        uses: actions/cache/save@v4
        with:
          path: SourcePackages
          key: spm-${{ hashFiles('project.yml') }}
        continue-on-error: true

      - name: 編譯檢查（未簽署）
        if: env.HAS_KEY != 'true'
        run: |
          set -o pipefail
          xcodebuild build -project HomeCam.xcodeproj -scheme HomeCam \
            -destination 'generic/platform=iOS' -clonedSourcePackagesDirPath SourcePackages \
            CODE_SIGNING_ALLOWED=NO PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" | tee build.log | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: 準備 App Store Connect 金鑰
        if: env.HAS_KEY == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          # 容錯：貼上時少了 BEGIN/END 兩行、多了空白或換行都自動修正
          python3 - <<'PY'
          import os, re, textwrap
          raw = os.environ["ASC_KEY_P8"]
          body = re.sub(r"-----(BEGIN|END) PRIVATE KEY-----", "", raw)
          body = re.sub(r"[^A-Za-z0-9+/=]", "", body)
          pem = "-----BEGIN PRIVATE KEY-----\n" + "\n".join(textwrap.wrap(body, 64)) + "\n-----END PRIVATE KEY-----\n"
          open(os.path.expanduser("~/.appstoreconnect/private_keys/AuthKey.p8"), "w").write(pem)
          print("金鑰長度（字元）:", len(body))
          PY
          sed "s/__TEAM_ID__/$TEAM_ID/" ci/ExportOptions.plist > ExportOptions.plist

      - name: 檢查 Apple 金鑰與 App 設定
        if: env.HAS_KEY == 'true'
        run: |
          pip3 install --quiet --break-system-packages pyjwt cryptography 2>/dev/null || pip3 install --quiet pyjwt cryptography
          python3 - <<'PY'
          import json, os, sys, time, urllib.request, urllib.error, jwt
          key = open(os.path.expanduser("~/.appstoreconnect/private_keys/AuthKey.p8")).read()
          kid, iss, bundle = os.environ["ASC_KEY"], os.environ["ASC_ISSUER"], os.environ["BUNDLE_ID"]
          tok = jwt.encode({"iss": iss, "iat": int(time.time()), "exp": int(time.time()) + 600, "aud": "appstoreconnect-v1"},
                           key, algorithm="ES256", headers={"kid": kid, "typ": "JWT"})
          def get(path):
              req = urllib.request.Request("https://api.appstoreconnect.apple.com" + path, headers={"Authorization": "Bearer " + tok})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r: return r.status, json.load(r)
              except urllib.error.HTTPError as e:
                  body = e.read().decode(errors="ignore")
                  return e.code, body
          code, data = get("/v1/apps?limit=200")
          print(f"金鑰 ID：{kid}　Issuer：{iss[:8]}…　API 回應：{code}")
          if code != 200:
              print("❌ 金鑰驗證失敗：金鑰 ID、Issuer ID 或 ASC_KEY_P8 內容不一致（或金鑰已撤銷）")
              print(str(data)[:300]); sys.exit(1)
          apps = [(a["attributes"]["bundleId"], a["attributes"]["name"]) for a in data["data"]]
          print("✅ 金鑰有效。帳號內的 App：", apps)
          if not any(b == bundle for b, _ in apps):
              print(f"❌ App Store Connect 還沒有套件 ID 為 {bundle} 的 App，請先建立"); sys.exit(1)
          print(f"✅ 找到 {bundle}")
          PY

      - name: 封存（先不簽署，避免每台雲端主機產生開發憑證）
        if: env.HAS_KEY == 'true'
        run: |
          set -o pipefail
          xcodebuild archive -project HomeCam.xcodeproj -scheme HomeCam \
            -destination 'generic/platform=iOS' -archivePath build/HomeCam.xcarchive \
            -clonedSourcePackagesDirPath SourcePackages \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey.p8 \
            -authenticationKeyID "$ASC_KEY" \
            -authenticationKeyIssuerID "$ASC_ISSUER" \
            DEVELOPMENT_TEAM="$TEAM_ID" PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            | tee archive.log | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" || true
          grep -q "ARCHIVE SUCCEEDED" archive.log

      - name: 預先簽署內嵌框架（讓匯出時能正確換成發佈簽章）
        if: env.HAS_KEY == 'true'
        run: |
          APP=build/HomeCam.xcarchive/Products/Applications/HomeCam.app
          for f in "$APP"/Frameworks/*.framework "$APP"/Frameworks/*.dylib; do
            [ -e "$f" ] && codesign --force --sign - --timestamp=none "$f"
          done
          codesign --force --sign - --timestamp=none --preserve-metadata=entitlements "$APP" || codesign --force --sign - "$APP"
          codesign -dv "$APP" 2>&1 | head -3

      - name: 雲端簽署並上傳到 TestFlight
        if: env.HAS_KEY == 'true'
        run: |
          set -o pipefail
          xcodebuild -exportArchive -archivePath build/HomeCam.xcarchive \
            -exportOptionsPlist ExportOptions.plist -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey.p8 \
            -authenticationKeyID "$ASC_KEY" \
            -authenticationKeyIssuerID "$ASC_ISSUER" | tee export.log | tail -20
          grep -qE "EXPORT SUCCEEDED|Upload succeeded" export.log
          echo "✅ 已上傳。約 5–15 分鐘後，iPhone 的 TestFlight App 會出現更新。" >> $GITHUB_STEP_SUMMARY

      - name: 失敗時保留紀錄
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: "*.log"
          retention-days: 7

      - name: 清除金鑰
        if: always()
        run: rm -rf ~/.appstoreconnect ExportOptions.plist
